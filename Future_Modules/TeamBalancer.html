<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workforce Team Balancer & Pairer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    [draggable="true"] {
      cursor: grab;
    }
    .member-item:active {
      cursor: grabbing;
    }
    .drag-over {
      border: 2px dashed #3b82f6 !important;
      background-color: #eff6ff !important;
    }
    .nav-btn {
      background-color: #f3f4f6;
      color: #374151;
      border-color: #d1d5db;
    }
    .nav-btn.active {
      background-color: #2563eb;
      color: white;
      border-color: #2563eb;
    }
    .team-dropzone,
    .member-item,
    .member-item span,
    #pairedTeamsList,
    #pairedTeamsList span,
    #pairedTeamsList div {
      color: #111827;
    }
    @media print {
      @page {
        size: landscape;
        margin: 0.22in;
      }
      html,
      body {
        background: white !important;
        color: #000 !important;
        height: auto !important;
        overflow: visible !important;
        font-size: 7px !important;
        line-height: 1.05 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      header,
      #metricsBar,
      #warningsBar,
      #emptyState,
      #viewToggles,
      #viewAllContainer,
      #unpairedSection,
      button,
      select,
      label,
      input,
      svg {
        display: none !important;
      }
      main {
        padding: 0 !important;
        margin: 0 !important;
        overflow: visible !important;
      }
      #viewPairContainer {
        display: block !important;
        width: 100% !important;
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      #pairedTeamsList {
        display: grid !important;
        grid-template-columns: 1fr 1fr !important;
        gap: 5px !important;
        width: 100% !important;
      }
      #pairedTeamsList > div {
        margin: 0 !important;
        break-inside: avoid !important;
        page-break-inside: avoid !important;
      }
      #pairedTeamsList > div > div {
        border: 1px solid #7f8b99 !important;
        border-radius: 2px !important;
        background: white !important;
        box-shadow: none !important;
        overflow: hidden !important;
      }
      #pairedTeamsList > div > div > div:first-child {
        padding: 3px 4px !important;
        background: #e5e7eb !important;
        border-bottom: 1px solid #7f8b99 !important;
      }
      #pairedTeamsList h2,
      #pairedTeamsList h3 {
        margin: 0 !important;
        color: #000 !important;
        font-size: 7px !important;
        font-weight: 900 !important;
        line-height: 1 !important;
      }
      #pairedTeamsList [id^="pair-"] {
        display: grid !important;
        grid-template-columns: 1fr 1fr !important;
        gap: 3px !important;
        padding: 3px !important;
      }
      #pairedTeamsList .team-card {
        border: 1px solid #7f8b99 !important;
        border-radius: 2px !important;
        background: white !important;
        box-shadow: none !important;
      }
      #pairedTeamsList .team-dropzone {
        display: block !important;
        max-height: none !important;
        min-height: 0 !important;
        overflow: visible !important;
        border: none !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      #pairedTeamsList ul {
        display: grid !important;
        grid-template-columns: 1fr 1fr !important;
        gap: 1px 2px !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      #pairedTeamsList li.member-item {
        display: grid !important;
        grid-template-columns: 1fr auto !important;
        gap: 2px !important;
        align-items: center !important;
        padding: 1px 2px !important;
        border: 1px solid #9ca3af !important;
        border-radius: 2px !important;
        background: white !important;
        color: #000 !important;
        box-shadow: none !important;
        font-size: 5.5px !important;
        line-height: 1 !important;
      }
      #pairedTeamsList li.member-item span,
      #pairedTeamsList li.member-item div {
        color: #000 !important;
        font-size: 5.5px !important;
        line-height: 1 !important;
      }
      #pairedTeamsList .hidden {
        display: block !important;
      }
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen flex flex-col overflow-hidden">
  <header class="bg-white shadow z-10">
    <div class="max-w-[95%] mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center space-x-3">
        <svg
          class="w-6 h-6 text-blue-600"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656-.126-1.283-.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z">
          </path>
        </svg>
        <h1 class="text-xl font-bold text-gray-900 truncate">
          Team Balance & Pair Tool
        </h1>
      </div>
      <div

          Summary by Pair

        <button

          class="nav-btn text-sm font-medium px-3 py-1.5 rounded border shadow-sm">
          All Teams Grid
        </button>
      </div>
      <div class="flex flex-wrap items-center gap-3">
        <input
          type="file"
          id="fileInput"
          accept=".json"
          class="hidden">
        <label
          for="fileInput"
          class="cursor-pointer text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 border border-gray-300 px-4 py-2 rounded shadow-sm">
          1. Load JSON
        </label>
        <button
          id="btnAutoBalance"
          disabled
          class="disabled:opacity-50 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded shadow-sm">

        <button

        <button

          Export Pairs CSV
        </button>
        <button
          id="btnPrintPdf"

          Print PDF
        </button>
      </div>
    </div>
  </header>

  <div
    id="metricsBar"
    class="hidden bg-gray-800 text-white text-sm px-4 py-2 shadow-inner flex flex-wrap justify-between items-center z-10">
    <div class="flex flex-wrap gap-x-6 gap-y-1">
      <div>
        <strong>Total Lines:</strong>
        <span id="valTotalLines">-</span>
      </div>
      <div>
        <strong>Eligible:</strong>
        <span id="valEligibleLines">-</span>
      </div>
      <div>
        <strong>TSO:</strong>
        <span id="valTsoLines">-</span>
      </div>
      <div>
        <strong>LTSO:</strong>
        <span id="valLtsoLines">-</span>
      </div>
      <div>
        <strong>STSO:</strong>
        <span id="valStsoLines">-</span>
      </div>
      <div>
        <strong>Assigned:</strong>
        <span id="valAssignedLines">-</span>
      </div>
      <div>
        <strong>Other Positions:</strong>
        <span id="valExcludedLines">-</span>
      </div>
      <div>
        <strong>Target/Team:</strong>
        <span id="valTargetSize">-</span>
      </div>
      <div>
        <strong>Avg Cohesion:</strong>
        <span id="valGlobalCohesion">-</span>
      </div>
    </div>
    <div id="statusAlert" class="text-yellow-300 font-medium"></div>
  </div>

  <div
    id="warningsBar"
    class="hidden bg-orange-100 text-orange-800 text-xs px-4 py-2 shadow-inner border-b border-orange-200 z-10">
    <div id="warningsList" class="flex flex-wrap gap-2"></div>
  </div>

  <main class="flex-1 overflow-auto p-4 md:p-6">
    <div
      id="emptyState"
      class="h-full flex flex-col items-center justify-center text-gray-400">
      <p class="text-lg">
        Load a Scheduler JSON export to begin
      </p>
    </div>

    <div
      id="viewPairContainer"
      class="hidden max-w-[95%] mx-auto pb-12">
      <div
        id="pairedTeamsList"
        class="grid grid-cols-1 xl:grid-cols-2 gap-4">
      </div>
      <div
        id="unpairedSection"
        class="pt-6 border-t border-gray-300 mt-6">
        <h2 class="text-lg font-bold text-gray-700 mb-4">
          Unpaired Teams
        </h2>
        <div
          id="unpairedTeamsGrid"
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
        </div>
      </div>
    </div>

    <div
      id="viewAllContainer"
      class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 max-w-[95%] mx-auto pb-12">
    </div>
  </main>

  <script>
    "use strict";

    let appData = null;
    let linesMap = {};
    let shiftsMap = {};
    let rolesMap = {};

    const DAYS = [
      "Sun",
      "Mon",
      "Tue",
      "Wed",
      "Thu",
      "Fri",
      "Sat"
    ];

    const TEAM_ROLES = new Set([
      "STSO",
      "LTSO",
      "TSO"
    ]);

    let currentView = "pair";
    let draggedLineId = null;
    let openPairs = new Set();
    let openTeamMembers = new Set();

    const DOM = {
      fileInput: document.getElementById("fileInput"),
      btnAutoBalance: document.getElementById("btnAutoBalance"),
      btnExport: document.getElementById("btnExport"),
      btnExportCsv: document.getElementById("btnExportCsv"),
      btnPrintPdf: document.getElementById("btnPrintPdf"),
      btnViewPair: document.getElementById("btnViewPair"),
      btnViewAll: document.getElementById("btnViewAll"),
      viewToggles: document.getElementById("viewToggles"),
      emptyState: document.getElementById("emptyState"),
      metricsBar: document.getElementById("metricsBar"),
      warningsBar: document.getElementById("warningsBar"),
      warningsList: document.getElementById("warningsList"),
      viewPairContainer: document.getElementById("viewPairContainer"),
      pairedTeamsList: document.getElementById("pairedTeamsList"),
      unpairedSection: document.getElementById("unpairedSection"),
      unpairedTeamsGrid: document.getElementById("unpairedTeamsGrid"),
      viewAllContainer: document.getElementById("viewAllContainer"),
      valTotalLines: document.getElementById("valTotalLines"),
      valEligibleLines: document.getElementById("valEligibleLines"),
      valTsoLines: document.getElementById("valTsoLines"),
      valLtsoLines: document.getElementById("valLtsoLines"),
      valStsoLines: document.getElementById("valStsoLines"),
      valAssignedLines: document.getElementById("valAssignedLines"),
      valExcludedLines: document.getElementById("valExcludedLines"),
      valTargetSize: document.getElementById("valTargetSize"),
      valGlobalCohesion: document.getElementById("valGlobalCohesion"),
      statusAlert: document.getElementById("statusAlert")
    };

    DOM.fileInput.addEventListener("change", handleFile);
    DOM.btnAutoBalance.addEventListener("click", runAutoBalance);
    DOM.btnExport.addEventListener("click", exportJSON);
    DOM.btnExportCsv.addEventListener("click", exportPairsCSV);
    DOM.btnPrintPdf.addEventListener("click", printSummaryByPair);
    DOM.btnViewPair.addEventListener("click", () => setView("pair"));
    DOM.btnViewAll.addEventListener("click", () => setView("all"));

    function idKey(value) {
      return String(value);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeCsv(value) {
      if (value === null || value === undefined) {
        return "";
      }
      return `"${String(value).replace(/"/g, '""')}"`;
    }

    function lineById(lineId) {
      return linesMap[idKey(lineId)] || null;
    }

    function teamById(teamId) {
      return (appData?.results?.teams || []).find(
        team => idKey(team.id) === idKey(teamId)
      ) || null;
    }

    /*
      ROLE RULES FOR THIS SCHEDULER FORMAT
      1. Explicit STSO indicators become STSO.
      2. Explicit LTSO indicators become LTSO.
      3. Explicit TSO indicators become TSO.
      4. Explicit extra positions, including ESTI and MSTI, are excluded.
      5. A normal FT/PT line with no position field (or a position mapping to FT/PT) is a TSO.
    */
    function detectTeamRole(line) {
      if (!line) return null;

      if (
        line.isStso === true ||
        String(line.position || "").trim().toUpperCase() === "STSO" ||
        String(line.role || "").trim().toUpperCase() === "STSO" ||
        String(line.empClass || "").trim().toUpperCase() === "STSO"
      ) {
        return "STSO";
      }

      if (
        line.isLtso === true ||
        String(line.position || "").trim().toUpperCase() === "LTSO" ||
        String(line.role || "").trim().toUpperCase() === "LTSO" ||
        String(line.empClass || "").trim().toUpperCase() === "LTSO"
      ) {
        return "LTSO";
      }

      if (
        line.isExtra === true ||
        line.extraPositionId ||
        line.extraName
      ) {
        return null;
      }

      const explicitPosition = String(
        line.position ||
        line.role ||
        line.positionCode ||
        line.positionName ||
        line.jobCode ||
        line.jobTitle ||
        line.title ||
        ""
      ).trim().toUpperCase();

      if (explicitPosition === "TSO" || explicitPosition === "FT" || explicitPosition === "PT") {
        return "TSO";
      }

      if (
        explicitPosition &&
        !TEAM_ROLES.has(explicitPosition)
      ) {
        return null;
      }

      const lineCode = String(
        line.lineCode || ""
      ).trim().toUpperCase();

      if (/^STSO(?:\s|[-_]|$)/.test(lineCode)) {
        return "STSO";
      }
      if (/^LTSO(?:\s|[-_]|$)/.test(lineCode)) {
        return "LTSO";
      }
      if (/^TSO(?:\s|[-_]|$)/.test(lineCode)) {
        return "TSO";
      }

      const empClass = String(
        line.empClass || ""
      ).trim().toUpperCase();

      if (
        (empClass === "FT" || empClass === "PT")
      ) {
        return "TSO";
      }

      return null;
    }

    function getRole(lineOrId) {
      const line = typeof lineOrId === "object"
        ? lineOrId
        : lineById(lineOrId);
      if (!line) return null;
      return rolesMap[idKey(line.id)] || null;
    }

    function isEligibleLine(line) {
      return Boolean(
        line &&
        TEAM_ROLES.has(getRole(line))
      );
    }

    function getEligibleLines() {
      return (appData?.results?.lines || []).filter(
        isEligibleLine
      );
    }

    function getExcludedLines() {
      return (appData?.results?.lines || []).filter(
        line => !isEligibleLine(line)
      );
    }

    function getLinesByRole(role) {
      return getEligibleLines().filter(
        line => getRole(line) === role
      );
    }

    function setView(mode) {
      currentView = mode;
      DOM.btnViewPair.classList.toggle(
        "active",
        mode === "pair"
      );
      DOM.btnViewAll.classList.toggle(
        "active",
        mode === "all"
      );
      render();
    }

    function handleFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = loadEvent => {
        try {
          appData = JSON.parse(loadEvent.target.result);
          initData();
          render();
        } catch (error) {
          console.error(error);
          alert(
            "Invalid JSON file. Ensure it is a valid scheduler export."
          );
        }
      };
      reader.readAsText(file);
    }

    function initData() {
      linesMap = {};
      shiftsMap = {};
      rolesMap = {};
      openPairs.clear();
      openTeamMembers.clear();

      appData.results = appData.results || {};
      appData.results.lines = Array.isArray(
        appData.results.lines
      )
        ? appData.results.lines
        : [];
      appData.results.teams = Array.isArray(
        appData.results.teams
      )
        ? appData.results.teams
        : [];

      if (Array.isArray(appData.config?.shifts)) {
        appData.config.shifts.forEach(shift => {
          shiftsMap[idKey(shift.id)] = shift;
        });
      }

      appData.results.lines.forEach(line => {
        linesMap[idKey(line.id)] = line;
        rolesMap[idKey(line.id)] = detectTeamRole(line);
      });

      appData.results.teams = appData.results.teams.filter(team => {
        return (
          team.name !== "Unassigned/Other Roles" &&
          !String(team.id || "").startsWith("Team_Unlisted_")
        );
      });

      cleanTeamMemberships();

      DOM.emptyState.classList.add("hidden");
      DOM.viewToggles.classList.remove("hidden");
      DOM.metricsBar.classList.remove("hidden");
      DOM.btnAutoBalance.disabled = false;
      DOM.btnExport.disabled = false;
      DOM.btnExportCsv.disabled = false;
      DOM.btnPrintPdf.disabled = false;
    }

    function cleanTeamMemberships() {
      if (!appData?.results?.teams) return;

      const alreadyAssigned = new Set();
      appData.results.teams.forEach(team => {
        const cleanedMembers = [];
        (team.members || []).forEach(memberId => {
          const line = lineById(memberId);
          const key = idKey(memberId);
          if (!isEligibleLine(line)) return;
          if (alreadyAssigned.has(key)) return;
          alreadyAssigned.add(key);
          cleanedMembers.push(line.id);
        });
        team.members = cleanedMembers;
      });

      repairPairRelationships();
    }

    function repairPairRelationships() {
      const teams = appData?.results?.teams || [];
      const teamMap = new Map(
        teams.map(team => [idKey(team.id), team])
      );

      teams.forEach(team => {
        if (!team.members?.length) {
          team.pairedTeamId = null;
          return;
        }
        if (!team.pairedTeamId) return;

        const partner = teamMap.get(
          idKey(team.pairedTeamId)
        );
        if (
          !partner ||
          !partner.members?.length ||
          idKey(partner.id) === idKey(team.id)
        ) {
          team.pairedTeamId = null;
        }
      });

      teams.forEach(team => {
        if (!team.pairedTeamId) return;
        const partner = teamMap.get(
          idKey(team.pairedTeamId)
        );
        if (partner) {
          partner.pairedTeamId = team.id;
        }
      });
    }

    function makeUniqueTeam() {
      const teams = appData.results.teams;
      let sequence = teams.length + 1;
      let proposedId = `Team_${sequence}`;

      while (
        teams.some(team =>
          idKey(team.id) === proposedId
        )
      ) {
        sequence++;
        proposedId = `Team_${sequence}`;
      }

      const team = {
        id: proposedId,
        name: String(sequence).padStart(2, "0"),
        members: [],
        pairedTeamId: null
      };

      teams.push(team);
      return team;
    }

    function getMinutes(timeString) {
      if (!timeString) return 0;
      const [hours, minutes] = String(timeString)
        .split(":")
        .map(Number);
      if (!Number.isFinite(hours)) return 0;
      return (
        hours * 60 +
        (Number.isFinite(minutes) ? minutes : 0)
      );
    }

    function getShift(line) {
      if (!line) return null;
      return shiftsMap[idKey(line.shiftId)] || null;
    }

    function getShiftDurationHours(shift) {
      if (!shift?.start || !shift?.end) {
        return 0;
      }
      const start = getMinutes(shift.start);
      let end = getMinutes(shift.end);
      if (end <= start) {
        end += 1440;
      }
      return (end - start) / 60;
    }

    function getShiftOverlapHours(firstShift, secondShift) {
      if (!firstShift || !secondShift) {
        return 0;
      }
      const firstStart = getMinutes(firstShift.start);
      let firstEnd = getMinutes(firstShift.end);
      const secondStart = getMinutes(secondShift.start);
      let secondEnd = getMinutes(secondShift.end);

      if (firstEnd <= firstStart) {
        firstEnd += 1440;
      }
      if (secondEnd <= secondStart) {
        secondEnd += 1440;
      }

      return Math.max(
        0,
        Math.min(firstEnd, secondEnd) -
        Math.max(firstStart, secondStart)
      ) / 60;
    }

    function isWorkDay(line, dayIndex) {
      if (!line) return false;
      const schedule =
        appData.results.schedule?.[line.id] ??
        appData.results.schedule?.[idKey(line.id)];

      if (Array.isArray(schedule)) {
        return (
          String(schedule[dayIndex]).toUpperCase() === "WORK"
        );
      }

      return !(
        line.rdoDays || []
      ).map(Number).includes(dayIndex);
    }

    function getSide(line) {
      const shift = getShift(line);
      if (!shift) {
        return "AM";
      }
      return getMinutes(shift.start) < 11 * 60
        ? "AM"
        : "PM";
    }

    function getRdoOverlap(firstLine, secondLine) {
      if (!firstLine || !secondLine) return 0;
      const firstRdos = (
        firstLine.rdoDays || []
      ).map(Number);
      const secondRdos = (
        secondLine.rdoDays || []
      ).map(Number);

      return firstRdos.filter(day =>
        secondRdos.includes(day)
      ).length;
    }

    function calculateTeamStats(team, includePairWarnings = true) {
      const lines = (team.members || [])
        .map(lineById)
        .filter(isEligibleLine);

      const stats = {
        size: lines.length,
        M: 0,
        F: 0,
        STSO: 0,
        STSO_M: 0,
        STSO_F: 0,
        LTSO: 0,
        LTSO_M: 0,
        LTSO_F: 0,
        TSO: 0,
        TSO_M: 0,
        TSO_F: 0,
        cohesion: null,
        anchor: null,
        side: "AM",
        warnings: [],
        memberCohesions: {}
      };

      if (!lines.length) {
        return stats;
      }

      lines.forEach(line => {
        const role = getRole(line);
        const sex = String(line.sex || "").toUpperCase();

        if (sex === "M") stats.M++;
        if (sex === "F") stats.F++;

        if (role === "STSO") {
          stats.STSO++;
          if (sex === "M") stats.STSO_M++;
          if (sex === "F") stats.STSO_F++;
        }
        if (role === "LTSO") {
          stats.LTSO++;
          if (sex === "M") stats.LTSO_M++;
          if (sex === "F") stats.LTSO_F++;
        }
        if (role === "TSO") {
          stats.TSO++;
          if (sex === "M") stats.TSO_M++;
          if (sex === "F") stats.TSO_F++;
        }
      });

      stats.anchor =
        lines.find(line => getRole(line) === "STSO") ||
        lines[0];
      stats.side = getSide(stats.anchor);

      const anchorShift = getShift(stats.anchor);
      const ratios = [];

      lines.forEach(line => {
        if (idKey(line.id) === idKey(stats.anchor.id)) {
          stats.memberCohesions[idKey(line.id)] = 100;
          return;
        }

        const lineShift = getShift(line);
        const dailyHours =
          getShiftDurationHours(lineShift) ||
          Number(line.paid) ||
          8;
        const dailyOverlap = getShiftOverlapHours(
          anchorShift,
          lineShift
        );

        let ownHours = 0;
        let overlapHours = 0;

        for (let day = 0; day < 7; day++) {
          if (!isWorkDay(line, day)) continue;
          ownHours += dailyHours;
          if (isWorkDay(stats.anchor, day)) {
            overlapHours += Math.min(
              dailyOverlap,
              dailyHours
            );
          }
        }

        const ratio = ownHours > 0
          ? Math.max(
              0,
              Math.min(overlapHours / ownHours, 1)
            )
          : 0;

        ratios.push(ratio);
        stats.memberCohesions[idKey(line.id)] = ratio * 100;

        if (getSide(line) !== stats.side) {
          stats.warnings.push(
            `Wrong side: ${line.lineCode || line.id} (${getSide(line)})`
          );
        }
      });

      if (ratios.length) {
        stats.cohesion =
          (ratios.reduce((sum, ratio) => sum + ratio, 0) / ratios.length) * 100;
      }

      if (includePairWarnings && team.pairedTeamId) {
        const partner = teamById(team.pairedTeamId);
        if (partner) {
          const partnerStats = calculateTeamStats(
            partner,
            false
          );
          if (
            partnerStats.anchor &&
            partnerStats.side !== stats.side
          ) {
            stats.warnings.push(
              "Side mismatch with pair"
            );
          }
          if (
            partnerStats.anchor &&
            stats.anchor &&
            getRdoOverlap(
              stats.anchor,
              partnerStats.anchor
            ) > 1
          ) {
            stats.warnings.push(
              "Pair RDO overlap ≥ 2 days"
            );
          }
        }
      }

      return stats;
    }

    function calculateMemberCoverage(
      line,
      homeAnchor,
      partnerAnchor = null
    ) {
      if (!line) return 0;
      const lineShift = getShift(line);
      const dailyHours =
        getShiftDurationHours(lineShift) ||
        Number(line.paid) ||
        8;

      let ownHours = 0;
      let coveredHours = 0;

      for (let day = 0; day < 7; day++) {
        if (!isWorkDay(line, day)) continue;
        ownHours += dailyHours;

        const homeWorks =
          homeAnchor &&
          isWorkDay(homeAnchor, day);
        const partnerWorks =
          partnerAnchor &&
          isWorkDay(partnerAnchor, day);

        const homeOverlap = homeAnchor
          ? getShiftOverlapHours(
              getShift(homeAnchor),
              lineShift
            )
          : 0;
        const partnerOverlap = partnerAnchor
          ? getShiftOverlapHours(
              getShift(partnerAnchor),
              lineShift
            )
          : 0;

        if (homeWorks) {
          coveredHours += Math.min(
            homeOverlap,
            dailyHours
          );
        } else if (partnerWorks) {
          coveredHours += Math.min(
            partnerOverlap,
            dailyHours
          );
        }
      }

      if (!ownHours) return 0;
      return Math.max(
        0,
        Math.min(coveredHours / ownHours, 1)
      ) * 100;
    }

    function calculatePairCohesion(
      firstNode,
      secondNode
    ) {
      const firstAnchor = firstNode.stats.anchor;
      const secondAnchor = secondNode.stats.anchor;
      const ratios = [];

      (firstNode.team.members || []).forEach(memberId => {
        const line = lineById(memberId);
        if (
          !isEligibleLine(line) ||
          idKey(line.id) === idKey(firstAnchor?.id)
        ) {
          return;
        }
        ratios.push(
          calculateMemberCoverage(
            line,
            firstAnchor,
            secondAnchor
          ) / 100
        );
      });

      (secondNode.team.members || []).forEach(memberId => {
        const line = lineById(memberId);
        if (
          !isEligibleLine(line) ||
          idKey(line.id) === idKey(secondAnchor?.id)
        ) {
          return;
        }
        ratios.push(
          calculateMemberCoverage(
            line,
            secondAnchor,
            firstAnchor
          ) / 100
        );
      });

      if (!ratios.length) {
        return 100;
      }

      return (
        (ratios.reduce((sum, ratio) => sum + ratio, 0) / ratios.length) * 100
      );
    }

    function getAssignedEligibleIds() {
      const assignedIds = new Set();
      (appData.results.teams || []).forEach(team => {
        (team.members || []).forEach(memberId => {
          if (isEligibleLine(lineById(memberId))) {
            assignedIds.add(idKey(memberId));
          }
        });
      });
      return assignedIds;
    }

    function chooseBestTeam(
      line,
      candidateTeams,
      targetSize
    ) {
      let bestTeam = null;
      let bestScore = -Infinity;

      candidateTeams.forEach(team => {
        const currentStats = calculateTeamStats(
          team,
          false
        );
        if (
          getRole(line) === "STSO" &&
          currentStats.STSO >= 1
        ) {
          return;
        }

        team.members.push(line.id);
        const proposedStats = calculateTeamStats(
          team,
          false
        );
        team.members.pop();

        let score = 0;
        score -= currentStats.size * 100;
        if (currentStats.size < targetSize) {
          score += 400;
        } else {
          score -= 400;
        }

        if (getRole(line) === "LTSO") {
          if (currentStats.LTSO === 0) {
            score += 600;
          } else {
            score -= currentStats.LTSO * 300;
          }
        }

        score += proposedStats.cohesion || 0;

        if (score > bestScore) {
          bestScore = score;
          bestTeam = team;
        }
      });

      return bestTeam;
    }

    function assignSide(sideLines, sideTeams) {
      if (!sideLines.length || !sideTeams.length) return;

      const stsoLines = sideLines
        .filter(line => getRole(line) === "STSO")
        .sort((a, b) =>
          idKey(a.id).localeCompare(idKey(b.id))
        );

      const ltsoLines = sideLines
        .filter(line => getRole(line) === "LTSO")
        .sort((a, b) =>
          idKey(a.id).localeCompare(idKey(b.id))
        );

      const tsoLines = sideLines
        .filter(line => getRole(line) === "TSO")
        .sort((a, b) =>
          Number(a.id) - Number(b.id)
        );

      // Assign exactly 1 STSO per team up to available teams.
      // Extra STSOs that do not fit into existing teams are left unassigned.
      stsoLines.forEach((line, index) => {
        if (index < sideTeams.length) {
          sideTeams[index].members.push(line.id);
        }
      });

      // Target team size expanded by +2
      const targetSize = Math.ceil(
        sideLines.length / sideTeams.length
      ) + 2;

      ltsoLines.forEach(line => {
        let destination = chooseBestTeam(
          line,
          sideTeams,
          targetSize
        );
        if (!destination) {
          destination = [...sideTeams].sort((a, b) => a.members.length - b.members.length)[0];
        }
        if (destination) {
          destination.members.push(line.id);
        }
      });

      tsoLines.forEach(line => {
        let destination = chooseBestTeam(
          line,
          sideTeams,
          targetSize
        );
        if (!destination) {
          destination = [...sideTeams].sort((a, b) => a.members.length - b.members.length)[0];
        }
        if (destination) {
          destination.members.push(line.id);
        }
      });
    }

    function ensureAllEligibleLinesAssigned(
      amTeams,
      pmTeams
    ) {
      cleanTeamMemberships();
      const assignedIds = getAssignedEligibleIds();
      const eligibleLines = getEligibleLines();

      eligibleLines.forEach(line => {
        const key = idKey(line.id);
        if (assignedIds.has(key)) return;

        // Extra STSOs should NOT be forced into teams that already have an STSO
        if (getRole(line) === "STSO") {
          return;
        }

        const sideTeams =
          getSide(line) === "AM"
            ? amTeams
            : pmTeams;

        if (!sideTeams.length) return;

        const sideLineCount = eligibleLines.filter(
          candidate =>
            getSide(candidate) === getSide(line)
        ).length;

        // Expanded team target size by +2
        const targetSize = Math.ceil(
          sideLineCount / sideTeams.length
        ) + 2;

        let destination = chooseBestTeam(
          line,
          sideTeams,
          targetSize
        );
        if (!destination) {
          destination = [...sideTeams].sort((a, b) => a.members.length - b.members.length)[0];
        }
        if (destination) {
          destination.members.push(line.id);
          assignedIds.add(key);
        }
      });

      cleanTeamMemberships();
      const finalAssigned = getAssignedEligibleIds();

      return {
        eligibleCount: eligibleLines.length,
        assignedCount: finalAssigned.size,
        missingLineIds: eligibleLines
          .filter(line =>
            !finalAssigned.has(idKey(line.id))
          )
          .map(line => line.id)
      };
    }

    function pairTeamsForSide(sideTeams) {
      sideTeams.forEach(team => {
        team.pairedTeamId = null;
      });

      const available = sideTeams.filter(
        team => team.members?.length
      );

      while (available.length >= 2) {
        const firstTeam = available.shift();
        const firstStats = calculateTeamStats(
          firstTeam,
          false
        );

        let bestIndex = -1;
        let bestScore = -Infinity;

        available.forEach((candidate, index) => {
          const candidateStats = calculateTeamStats(
            candidate,
            false
          );
          const overlap = getRdoOverlap(
            firstStats.anchor,
            candidateStats.anchor
          );

          let score = 0;
          if (overlap === 0) score += 1000;
          if (overlap === 1) score += 500;
          if (overlap >= 2) score -= overlap * 300;

          score -= Math.abs(
            firstStats.size -
            candidateStats.size
          ) * 10;

          if (score > bestScore) {
            bestScore = score;
            bestIndex = index;
          }
        });

        if (bestIndex >= 0) {
          const partner = available.splice(
            bestIndex,
            1
          )[0];
          firstTeam.pairedTeamId = partner.id;
          partner.pairedTeamId = firstTeam.id;
        }
      }
    }

    function runAutoBalance() {
      if (!appData) return;
      DOM.btnAutoBalance.innerText = "Balancing...";
      DOM.btnAutoBalance.disabled = true;

      setTimeout(() => {
        try {
          const teams = appData.results.teams;
          const eligibleLines = getEligibleLines();
          const excludedLines = getExcludedLines();
          const tsoLines = getLinesByRole("TSO");
          const ltsoLines = getLinesByRole("LTSO");
          const stsoLines = getLinesByRole("STSO");

          if (!eligibleLines.length) {
            alert(
              "No STSO, LTSO, or TSO lines were detected."
            );
            return;
          }

          if (!teams.length) {
            alert("No teams found in dataset. Please make sure teams are defined.");
            return;
          }

          teams.forEach(team => {
            team.members = [];
            team.pairedTeamId = null;
          });

          const amLines = eligibleLines.filter(
            line => getSide(line) === "AM"
          );
          const pmLines = eligibleLines.filter(
            line => getSide(line) === "PM"
          );

          // Work strictly within existing teams count (no auto team creation)
          let numberOfAmTeams = Math.round(
            teams.length * (amLines.length / eligibleLines.length)
          );

          if (!amLines.length) {
            numberOfAmTeams = 0;
          } else if (!pmLines.length) {
            numberOfAmTeams = teams.length;
          } else {
            numberOfAmTeams = Math.max(1, Math.min(numberOfAmTeams, teams.length - 1));
          }

          const amTeams = teams.slice(0, numberOfAmTeams);
          const pmTeams = teams.slice(numberOfAmTeams);

          assignSide(amLines, amTeams);
          assignSide(pmLines, pmTeams);

          const validation =
            ensureAllEligibleLinesAssigned(
              amTeams,
              pmTeams
            );

          pairTeamsForSide(amTeams);
          pairTeamsForSide(pmTeams);

          cleanTeamMemberships();

          const unassignedStsos = stsoLines.filter(
            line => !validation.missingLineIds.includes(line.id) === false
          );

          appData.meta = appData.meta || {};
          appData.meta.toolReport = {
            ranAt: new Date().toISOString(),
            eligibleRoles: [
              "STSO",
              "LTSO",
              "TSO"
            ],
            totalLineCount:
              appData.results.lines.length,
            tsoLineCount: tsoLines.length,
            ltsoLineCount: ltsoLines.length,
            stsoLineCount: stsoLines.length,
            eligibleLineCount:
              validation.eligibleCount,
            assignedEligibleLineCount:
              validation.assignedCount,
            missingEligibleLineIds:
              validation.missingLineIds,
            unassignedStsoCount: unassignedStsos.length,
            excludedLineCount:
              excludedLines.length,
            excludedLineIds:
              excludedLines.map(line => line.id),
            note:
              "Existing teams strictly preserved without creating new teams. " +
              "Team target size expanded by +2. Unteamed STSOs kept unassigned."
          };

          render();

          let reportMsg = `Auto-Balance complete.\n\n` +
            `Teams Used: ${teams.length}\n` +
            `TSO assigned: ${tsoLines.filter(l => !validation.missingLineIds.includes(l.id)).length}\n` +
            `LTSO assigned: ${ltsoLines.filter(l => !validation.missingLineIds.includes(l.id)).length}\n` +
            `STSO assigned: ${stsoLines.filter(l => !validation.missingLineIds.includes(l.id)).length}`;

          if (validation.missingLineIds.length) {
            reportMsg += `\n\nUnassigned lines (${validation.missingLineIds.length}):\n` +
              validation.missingLineIds.join(", ");
          }

          alert(reportMsg);
        } catch (error) {
          console.error(error);
          alert(
            "Auto-Balance encountered an error. " +
            "Open the browser console for details."
          );
        } finally {
          DOM.btnAutoBalance.innerText =
            "2. Auto-Balance";
          DOM.btnAutoBalance.disabled = false;
        }
      }, 50);
    }

    function trimTeamSize(teamId) {
      const sourceTeam = teamById(teamId);
      if (!sourceTeam) return;

      const sourceStats = calculateTeamStats(
        sourceTeam,
        false
      );
      const sideTeams = appData.results.teams.filter(
        team => {
          if (!team.members?.length) return false;
          return (
            calculateTeamStats(team, false).side ===
            sourceStats.side
          );
        }
      );

      if (sideTeams.length < 2) {
        alert(
          "No other same-side team is available."
        );
        return;
      }

      const totalMembers = sideTeams.reduce(
        (sum, team) =>
          sum + team.members.length,
        0
      );
      // Team target size expanded by +2
      const targetSize = Math.ceil(
        totalMembers / sideTeams.length
      ) + 2;

      let excess =
        sourceTeam.members.length - targetSize;

      if (excess <= 0) {
        alert(
          `${sourceTeam.name} is already at or below target size ${targetSize}.`
        );
        return;
      }

      const movableLines = sourceTeam.members
        .map(lineById)
        .filter(Boolean)
        .filter(line =>
          idKey(line.id) !==
          idKey(sourceStats.anchor?.id)
        )
        .sort((a, b) => {
          const order = {
            TSO: 0,
            LTSO: 1,
            STSO: 2
          };
          return (
            order[getRole(a)] -
            order[getRole(b)]
          );
        });

      const moved = [];
      for (const line of movableLines) {
        if (excess <= 0) break;

        const destinations = sideTeams
          .filter(team =>
            idKey(team.id) !==
            idKey(sourceTeam.id)
          )
          .filter(team =>
            team.members.length < targetSize
          )
          .filter(team => {
            if (getRole(line) !== "STSO") {
              return true;
            }
            return !team.members.some(
              memberId =>
                getRole(memberId) === "STSO"
            );
          })
          .sort(
            (a, b) =>
              a.members.length -
              b.members.length
          );

        if (!destinations.length) continue;

        sourceTeam.members =
          sourceTeam.members.filter(
            memberId =>
              idKey(memberId) !==
              idKey(line.id)
          );

        destinations[0].members.push(line.id);
        moved.push(
          `${line.lineCode || line.id} → ${destinations[0].name}`
        );
        excess--;
      }

      if (moved.length) {
        alert(
          `Moved ${moved.length} member(s):\n` +
          moved.join("\n")
        );
        render();
      } else {
        alert(
          "No valid same-side destinations were available."
        );
      }
    }

    function disbandTeam(teamId) {
      const sourceTeam = teamById(teamId);
      if (!sourceTeam || !sourceTeam.members?.length) {
        alert("Source team is empty or does not exist.");
        return;
      }

      if (!confirm(`Are you sure you want to disband team "${sourceTeam.name}" and redistribute its ${sourceTeam.members.length} members?`)) {
        return;
      }

      const sourceStats = calculateTeamStats(sourceTeam, false);
      const membersToMove = [...sourceTeam.members].map(lineById).filter(Boolean);

      const sideTeams = appData.results.teams.filter(team => {
        if (idKey(team.id) === idKey(sourceTeam.id)) return false;
        if (!team.members?.length) return true;
        return calculateTeamStats(team, false).side === sourceStats.side;
      });

      if (sideTeams.length === 0) {
        alert("No other teams are available on the same side to move members to.");
        return;
      }

      const moved = [];
      membersToMove.forEach(line => {
        const destinations = sideTeams
          .filter(team => {
            if (getRole(line) === "STSO") {
              return !team.members.some(memberId => getRole(memberId) === "STSO");
            }
            return true;
          })
          .sort((a, b) => a.members.length - b.members.length);

        const destination = destinations[0];

        if (destination) {
          destination.members.push(line.id);
          moved.push(`${line.lineCode || line.id} → ${destination.name}`);
        } else {
          moved.push(`${line.lineCode || line.id} → UNASSIGNED (no valid team found)`);
        }
      });

      sourceTeam.members = [];
      if (sourceTeam.pairedTeamId) {
        const partner = teamById(sourceTeam.pairedTeamId);
        if (partner) {
          partner.pairedTeamId = null;
        }
        sourceTeam.pairedTeamId = null;
      }

      alert(`Disbanded ${sourceTeam.name} and redistributed ${moved.length} member(s):\n` + moved.join("\n"));
      render();
    }

    function handleDragStart(event, lineId) {
      draggedLineId = lineId;
      event.dataTransfer.setData(
        "text/plain",
        lineId
      );
      event.target.style.opacity = "0.5";
    }

    function handleDragEnd(event) {
      event.target.style.opacity = "1";
      draggedLineId = null;
      document
        .querySelectorAll(".team-dropzone")
        .forEach(element => {
          element.classList.remove("drag-over");
        });
    }

    function handleDragOver(event) {
      event.preventDefault();
      event.currentTarget.classList.add(
        "drag-over"
      );
    }

    function handleDragLeave(event) {
      event.currentTarget.classList.remove(
        "drag-over"
      );
    }

    function handleDrop(event, targetTeamId) {
      event.preventDefault();
      event.currentTarget.classList.remove(
        "drag-over"
      );

      const lineId =
        event.dataTransfer.getData("text/plain") ||
        draggedLineId;
      const line = lineById(lineId);
      const targetTeam = teamById(targetTeamId);

      if (!line || !targetTeam) return;

      if (!isEligibleLine(line)) {
        alert(
          "Only STSO, LTSO, and TSO lines may be assigned."
        );
        return;
      }

      if (getRole(line) === "STSO") {
        const hasStso = targetTeam.members.some(
          memberId =>
            idKey(memberId) !== idKey(line.id) &&
            getRole(memberId) === "STSO"
        );
        if (hasStso) {
          alert(
            `${targetTeam.name} already has an STSO.`
          );
          return;
        }
      }

      const targetSide = calculateTeamStats(
        targetTeam,
        false
      ).side;

      if (
        targetTeam.members.length &&
        getSide(line) !== targetSide
      ) {
        alert(
          `${line.lineCode || line.id} is ${getSide(line)}, but ${targetTeam.name} is ${targetSide}.`
        );
        return;
      }

      appData.results.teams.forEach(team => {
        team.members = (team.members || []).filter(
          memberId =>
            idKey(memberId) !== idKey(line.id)
        );
      });

      targetTeam.members.push(line.id);
      repairPairRelationships();
      render();
    }

    function updatePair(teamId, newPairId) {
      const firstTeam = teamById(teamId);
      if (!firstTeam) return;

      if (firstTeam.pairedTeamId) {
        const oldPartner = teamById(
          firstTeam.pairedTeamId
        );
        if (oldPartner) {
          oldPartner.pairedTeamId = null;
        }
      }

      firstTeam.pairedTeamId = null;

      if (
        !newPairId ||
        newPairId === "none"
      ) {
        render();
        return;
      }

      const secondTeam = teamById(newPairId);
      if (!secondTeam) return;

      const firstStats = calculateTeamStats(
        firstTeam,
        false
      );
      const secondStats = calculateTeamStats(
        secondTeam,
        false
      );

      if (firstStats.side !== secondStats.side) {
        alert(
          "AM and PM teams cannot be paired."
        );
        render();
        return;
      }

      if (secondTeam.pairedTeamId) {
        const oldPartner = teamById(
          secondTeam.pairedTeamId
        );
        if (oldPartner) {
          oldPartner.pairedTeamId = null;
        }
      }

      firstTeam.pairedTeamId = secondTeam.id;
      secondTeam.pairedTeamId = firstTeam.id;
      render();
    }

    function toggleTeamMembers(teamId) {
      if (openTeamMembers.has(teamId)) {
        openTeamMembers.delete(teamId);
      } else {
        openTeamMembers.add(teamId);
      }
      render();
    }

    function togglePair(pairId) {
      const pairElement =
        document.getElementById(pairId);
      const icon =
        document.getElementById(
          `icon-${pairId}`
        );

      if (!pairElement) return;
      pairElement.classList.toggle("hidden");

      }

      if (
        pairElement.classList.contains("hidden")
      ) {
        openPairs.delete(pairId);
      } else {
        openPairs.add(pairId);
      }
    }

    function getTeamCardHTML(
      team,
      stats,
      options = {}
    ) {

        options.showMembersByDefault ?? true;

        openTeamMembers.has(team.id);

          ? "N/A"
          : `${stats.cohesion.toFixed(1)}%`;

        stats.cohesion >= 75
          ? "text-green-600"
          : stats.cohesion !== null
            ? "text-orange-600 font-bold"
            : "text-gray-500";

      const anchorRdos =
        stats.anchor?.rdoDays?.length
          ? stats.anchor.rdoDays
              .map(day => DAYS[Number(day)])
              .join(", ")
          : "None";

      const sideBadge =
        stats.side === "AM"
          ? "bg-amber-100 text-amber-800"
          : "bg-indigo-100 text-indigo-800";

      let pairOptions =
        '<option value="none">-- Unpaired --</option>';

      appData.results.teams.forEach(optionTeam => {
        if (
          idKey(optionTeam.id) === idKey(team.id) ||
          !optionTeam.members?.length
        ) {
          return;
        }

        const optionStats = calculateTeamStats(
          optionTeam,
          false
        );

        if (optionStats.side !== stats.side) {
          return;
        }

        const selected =
          idKey(optionTeam.id) ===
          idKey(team.pairedTeamId)
            ? "selected"
            : "";

        pairOptions += `
          <option
            value="${escapeHtml(optionTeam.id)}"
            ${selected}>
            ${escapeHtml(optionTeam.name)}
          </option>
        `;
      });

      const warningsHtml = stats.warnings
        .map(warning => `
          <span class="inline-block bg-red-100 text-red-700 text-[10px] px-1.5 py-0.5 rounded mr-1 mb-1">
            ${escapeHtml(warning)}
          </span>
        `)
        .join("");

      let html = `
        <div class="team-card bg-white rounded-lg shadow-sm border ${
          stats.cohesion !== null &&
          stats.cohesion < 75
            ? "border-orange-300"
            : "border-gray-200"
        } flex flex-col h-full">
          <div class="p-3 border-b bg-gray-50 rounded-t-lg flex justify-between items-start gap-2">
            <div>
              <h3 class="font-bold text-gray-800">
                ${escapeHtml(team.name)}
              </h3>
              <div class="text-[10px] text-gray-500 mt-1 uppercase tracking-wider">
                Anchor RDO:
                <span class="font-bold text-gray-700">
                  ${escapeHtml(anchorRdos)}
                </span>
              </div>
            </div>
            <div class="text-right flex flex-col items-end gap-1">
                <div class="flex items-center gap-2">
                    <span class="text-[10px] px-2 py-0.5 rounded font-bold ${sideBadge}">
                        ${stats.side}
                    </span>
                    <button
                        onclick="trimTeamSize('${escapeHtml(team.id)}')"
                        class="text-[10px] px-2 py-1 rounded bg-slate-200 text-slate-700 hover:bg-slate-300 border border-slate-300 font-semibold">
                        Trim Size
                    </button>
                    <button
                        onclick="disbandTeam('${escapeHtml(team.id)}')"
                        class="text-[10px] px-2 py-1 rounded bg-red-200 text-red-700 hover:bg-red-300 border border-red-300 font-semibold">
                        Disband
                    </button>
                </div>
              <div class="text-base mt-1 ${cohesionColor}">
                ${cohesionText}
              </div>
            </div>
          </div>
          <div class="p-3 text-sm flex-1 flex flex-col">
            <div class="grid grid-cols-2 gap-1 mb-3 text-xs text-gray-600 bg-slate-50 p-2 rounded border border-slate-100">
              <div class="col-span-2 flex justify-between border-b pb-1 mb-1 border-slate-200">
                <span class="font-semibold text-slate-700">
                  Size: ${stats.size}
                </span>
                <span class="text-slate-500">
                  M:${stats.M} F:${stats.F}
                </span>
              </div>
              <div class="text-[10px]">
                <strong>STSO:</strong>
                ${stats.STSO}
                (${stats.STSO_M}M/${stats.STSO_F}F)
              </div>
              <div class="text-[10px]">
                <strong>LTSO:</strong>
                ${stats.LTSO}
                (${stats.LTSO_M}M/${stats.LTSO_F}F)
              </div>
              <div class="text-[10px] col-span-2">
                <strong>TSO:</strong>
                ${stats.TSO}
                (${stats.TSO_M}M/${stats.TSO_F}F)
              </div>
            </div>
            <div class="mb-2">
              <label class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider block mb-1">
                Pair With
              </label>
              <select
                onchange="updatePair('${escapeHtml(team.id)}', this.value)"
                class="w-full bg-white border border-gray-300 rounded text-xs px-2 py-1">
                ${pairOptions}
              </select>
            </div>
            ${
              warningsHtml
                ? `<div class="mb-2">${warningsHtml}</div>`
                : ""
            }
            <button
              onclick="toggleTeamMembers('${escapeHtml(team.id)}')"
              class="w-full text-xs font-semibold px-3 py-2 rounded bg-gray-100 hover:bg-gray-200 border border-gray-300 text-gray-700">
              ${
                membersOpen
                  ? "Hide Employees"
                  : `Show Employees (${stats.size})`
              }
            </button>
            <div
              class="${
                membersOpen ? "" : "hidden"
              } flex-1 team-dropzone border-2 border-transparent rounded bg-white min-h-[100px] max-h-[300px] overflow-y-auto mt-2"
              ondragover="handleDragOver(event)"
              ondragleave="handleDragLeave(event)"
              ondrop="handleDrop(event, '${escapeHtml(team.id)}')">
              <ul class="space-y-1 pb-2">
      `;

      (team.members || []).forEach(memberId => {
        const line = lineById(memberId);
        if (!isEligibleLine(line)) return;

        const role = getRole(line);
        const roleColor =
          role === "STSO"
            ? "text-purple-800 bg-purple-50 border-purple-200"
            : role === "LTSO"
              ? "text-blue-800 bg-blue-50 border-blue-200"
              : "text-gray-700 bg-gray-50 border-gray-100";

        const rdoText = (line.rdoDays || [])
          .map(day =>
            DAYS[Number(day)]?.substring(0, 1) || ""
          )
          .join("");

        const memberCohesion =
          stats.memberCohesions[idKey(line.id)] !==
          undefined
            ? Math.round(
                stats.memberCohesions[idKey(line.id)]
              )
            : null;

        const isAnchor =
          idKey(stats.anchor?.id) ===
          idKey(line.id);

        let cohesionBadge = "";
        if (isAnchor) {
          cohesionBadge = `
            <span class="text-[9px] bg-purple-200 text-purple-800 px-1.5 py-0.5 rounded ml-1 font-semibold border border-purple-300">
              Anchor
            </span>
          `;
        } else if (memberCohesion !== null) {
          const badgeColor =
            memberCohesion >= 75
              ? "text-green-700 bg-green-100 border-green-200"
              : "text-orange-700 bg-orange-100 border-orange-200";
          cohesionBadge = `
            <span class="text-[10px] font-bold ml-1 px-1.5 py-0.5 rounded border ${badgeColor}">
              ${memberCohesion}%
            </span>
          `;
        }

        html += `
          <li
            class="member-item flex justify-between items-center px-2 py-1.5 rounded border ${roleColor} text-xs hover:shadow-md"
            draggable="true"
            ondragstart="handleDragStart(event, '${escapeHtml(line.id)}')"
            ondragend="handleDragEnd(event)">
            <div class="flex items-center">
              <span class="font-bold">
                ${escapeHtml(line.lineCode || line.id)}
              </span>
              ${cohesionBadge}
            </div>
            <span class="text-[10px] opacity-80 whitespace-nowrap ml-2">
              ${escapeHtml(role)}
              • ${escapeHtml(line.sex || "")}
              • ${escapeHtml(rdoText)}
            </span>
          </li>
        `;
      });

      html += `
              </ul>
            </div>
          </div>
        </div>
      `;
      return html;
    }

    function render() {
      if (!appData) return;

      cleanTeamMemberships();

      DOM.pairedTeamsList.innerHTML = "";
      DOM.unpairedTeamsGrid.innerHTML = "";
      DOM.viewAllContainer.innerHTML = "";
      DOM.warningsList.innerHTML = "";

      const eligibleLines = getEligibleLines();
      const excludedLines = getExcludedLines();
      const tsoCount =
        getLinesByRole("TSO").length;
      const ltsoCount =
        getLinesByRole("LTSO").length;
      const stsoCount =
        getLinesByRole("STSO").length;

      const assignedIds =
        getAssignedEligibleIds();
      const nonEmptyTeams =
        appData.results.teams.filter(
          team => team.members?.length
        );

      const teamNodes = nonEmptyTeams.map(team => ({
        team,
        stats: calculateTeamStats(team)
      }));

      // Display Target Size with the expanded by 2 behavior included visually for the overall
      const targetSize = nonEmptyTeams.length
        ? Math.ceil(
            eligibleLines.length /
            nonEmptyTeams.length
          ) + 2
        : 0;

      const warnings = [];
      const unpairedTeams = [];
      const processedPairs = new Set();
      let totalCohesion = 0;
      let cohesionCount = 0;
      let sideMismatchCount = 0;

      teamNodes.forEach(node => {
        if (node.stats.cohesion !== null) {
          totalCohesion += node.stats.cohesion;
          cohesionCount++;
        }

        if (node.stats.STSO === 0) {
          warnings.push(`
            <span class="bg-orange-200 px-2 py-1 rounded">
              <strong>${escapeHtml(node.team.name)}</strong>:
              No STSO
            </span>
          `);
        }

        if (node.stats.STSO > 1) {
          warnings.push(`
            <span class="bg-red-200 px-2 py-1 rounded">
              <strong>${escapeHtml(node.team.name)}</strong>:
              ${node.stats.STSO} STSOs
            </span>
          `);
        }

        node.stats.warnings.forEach(warning => {
          if (
            warning.startsWith("Wrong side") ||
            warning.startsWith("Side mismatch")
          ) {
            sideMismatchCount++;
            warnings.push(`
              <span class="bg-red-500 text-white px-2 py-1 rounded">
                <strong>${escapeHtml(node.team.name)}</strong>:
                ${escapeHtml(warning)}
              </span>
            `);
          }
        });
      });

      if (assignedIds.size !== eligibleLines.length) {
        warnings.push(`
          <span class="bg-amber-200 text-amber-900 px-2 py-1 rounded">
            <strong>Notice:</strong> ${assignedIds.size} of ${eligibleLines.length} eligible lines assigned
          </span>
        `);
      }

      if (excludedLines.length) {
        const excludedNames = [
          ...new Set(
            excludedLines.map(line =>
              line.position ||
              line.extraName ||
              line.role ||
              "Other"
            )
          )
        ].join(", ");

        warnings.push(`
          <span class="bg-slate-200 text-slate-800 px-2 py-1 rounded">
            ${excludedLines.length} other-position line(s) retained without teams: ${escapeHtml(excludedNames)}
          </span>
        `);
      }

      if (warnings.length) {
        DOM.warningsList.innerHTML =
          `<strong>Alerts:</strong>${warnings.join("")}`;
        DOM.warningsBar.classList.remove("hidden");
      } else {
        DOM.warningsBar.classList.add("hidden");
      }

      // Keep export buttons usable after loading data
      DOM.btnExport.disabled = false;
      DOM.btnExportCsv.disabled = false;

      teamNodes.forEach(node => {
        const allWrapper =
          document.createElement("div");
        allWrapper.innerHTML = getTeamCardHTML(
          node.team,
          node.stats,
          {
            showMembersByDefault: true
          }
        );
        DOM.viewAllContainer.appendChild(
          allWrapper.firstElementChild
        );

        if (
          node.team.pairedTeamId &&
          !processedPairs.has(idKey(node.team.id))
        ) {
          const partnerNode = teamNodes.find(
            candidate =>
              idKey(candidate.team.id) ===
              idKey(node.team.pairedTeamId)
          );

          if (!partnerNode) {
            unpairedTeams.push(node);
            return;
          }

          processedPairs.add(idKey(node.team.id));
          processedPairs.add(idKey(partnerNode.team.id));

          const pairCohesion =
            calculatePairCohesion(
              node,
              partnerNode
            );

          const totalSize =
            node.stats.size +
            partnerNode.stats.size;
          const totalStso =
            node.stats.STSO +
            partnerNode.stats.STSO;
          const totalLtso =
            node.stats.LTSO +
            partnerNode.stats.LTSO;
          const totalTso =
            node.stats.TSO +
            partnerNode.stats.TSO;

          const pairColor =
            pairCohesion >= 75
              ? "text-green-700 bg-green-50"
              : "text-orange-700 bg-orange-50";

          const pairId =
            `pair-${node.team.id}-${partnerNode.team.id}`;
          const reversePairId =
            `pair-${partnerNode.team.id}-${node.team.id}`;
          const isOpen =
            openPairs.has(pairId) ||
            openPairs.has(reversePairId);

          const wrapper =
            document.createElement("div");

          wrapper.innerHTML = `
            <div class="bg-gray-100 border-2 border-gray-200 rounded-xl overflow-hidden shadow-sm">
              <div
                class="px-4 py-3 bg-gray-200 border-b border-gray-300 flex flex-wrap justify-between items-center gap-4 cursor-pointer hover:bg-gray-300"
                onclick="togglePair('${escapeHtml(pairId)}')">
                <div class="flex items-center space-x-3">
                  <svg
                    id="icon-${escapeHtml(pairId)}"
                    class="w-5 h-5 text-gray-500 transform transition-transform ${
                      isOpen ? "rotate-90" : ""
                    }"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M9 5l7 7-7 7">
                    </path>
                  </svg>
                  <h2 class="text-base font-bold text-gray-800">
                    Pairing Summary:
                    <span class="text-blue-600">
                      ${escapeHtml(node.team.name)}
                      &
                      ${escapeHtml(partnerNode.team.name)}
                    </span>
                  </h2>
                  <span class="px-3 py-1 rounded-full text-sm font-bold ${pairColor}">
                    Group Cohesion:
                    ${pairCohesion.toFixed(1)}%
                  </span>
                </div>
                <div class="flex space-x-3 text-[11px] font-medium text-gray-600 bg-white px-3 py-1.5 rounded-lg shadow-inner">
                  <span>
                    Size: <b>${totalSize}</b>
                  </span>
                  <span>
                    STSO: <b>${totalStso}</b>
                  </span>
                  <span>
                    LTSO: <b>${totalLtso}</b>
                  </span>
                  <span>
                    TSO: <b>${totalTso}</b>
                  </span>
                </div>
              </div>
              <div
                id="${escapeHtml(pairId)}"
                class="p-4 grid grid-cols-1 xl:grid-cols-2 gap-4 ${
                  isOpen ? "" : "hidden"
                }">
                ${getTeamCardHTML(
                  node.team,
                  node.stats,
                  {
                    showMembersByDefault: false
                  }
                )}
                ${getTeamCardHTML(
                  partnerNode.team,
                  partnerNode.stats,
                  {
                    showMembersByDefault: false
                  }
                )}
              </div>
            </div>
          `;
          DOM.pairedTeamsList.appendChild(
            wrapper.firstElementChild
          );
        } else if (!node.team.pairedTeamId) {
          unpairedTeams.push(node);
        }
      });

      if (unpairedTeams.length) {
        DOM.unpairedSection.classList.remove(
          "hidden"
        );
        unpairedTeams.forEach(node => {
          const wrapper =
            document.createElement("div");
          wrapper.innerHTML = getTeamCardHTML(
            node.team,
            node.stats,
            {
              showMembersByDefault: false
            }
          );
          DOM.unpairedTeamsGrid.appendChild(
            wrapper.firstElementChild
          );
        });
      } else {
        DOM.unpairedSection.classList.add(
          "hidden"
        );
      }

      DOM.viewPairContainer.classList.toggle(
        "hidden",
        currentView !== "pair"
      );
      DOM.viewAllContainer.classList.toggle(
        "hidden",
        currentView !== "all"
      );

      const overallCohesion = cohesionCount
        ? totalCohesion / cohesionCount
        : 0;

      DOM.valTotalLines.innerText =
        appData.results.lines.length;
      DOM.valEligibleLines.innerText =
        eligibleLines.length;
      DOM.valTsoLines.innerText =
        tsoCount;
      DOM.valLtsoLines.innerText =
        ltsoCount;
      DOM.valStsoLines.innerText =
        stsoCount;
      DOM.valAssignedLines.innerText =
        assignedIds.size;
      DOM.valExcludedLines.innerText =
        excludedLines.length;
      DOM.valTargetSize.innerText =
        targetSize;
      DOM.valGlobalCohesion.innerText =
        `${overallCohesion.toFixed(1)}%`;
      DOM.statusAlert.innerText =
        assignedIds.size === eligibleLines.length
          ? "All eligible lines assigned"
          : `${eligibleLines.length - assignedIds.size} unassigned eligible line(s)`;
    }

    function printSummaryByPair() {
      if (!appData) return;
      currentView = "pair";
      DOM.btnViewPair.classList.add("active");
      DOM.btnViewAll.classList.remove("active");
      openPairs.clear();
      openTeamMembers.clear();

      appData.results.teams.forEach(team => {
        if (team.pairedTeamId) {
          openPairs.add(
            `pair-${team.id}-${team.pairedTeamId}`
          );
          openPairs.add(
            `pair-${team.pairedTeamId}-${team.id}`
          );
        }
        openTeamMembers.add(team.id);
      });

      render();
      setTimeout(() => {
        window.print();
      }, 150);
    }

    function buildPairsExportData() {
      cleanTeamMemberships();
      const pairs = [];
      const unpaired = [];
      const processedPairs = new Set();

      const teamNodes = appData.results.teams
        .filter(team => team.members?.length)
        .map(team => ({
          team,
          stats: calculateTeamStats(team)
        }));

      teamNodes.forEach(node => {
        const team = node.team;
        const stats = node.stats;

        team.side = stats.side;
        team.teamCohesion =
          stats.cohesion !== null
            ? Number(stats.cohesion.toFixed(2))
            : null;
        team.anchorLineId =
          stats.anchor?.id ?? null;
        team.anchorRdoDays =
          stats.anchor?.rdoDays
            ? [...stats.anchor.rdoDays]
            : [];
        team.metrics = {
          size: stats.size,
          males: stats.M,
          females: stats.F,
          stso: stats.STSO,
          ltso: stats.LTSO,
          tso: stats.TSO
        };

        if (!team.pairedTeamId) {
          unpaired.push({
            id: team.id,
            name: team.name,
            side: stats.side,
            size: stats.size
          });
          return;
        }

        const partnerNode = teamNodes.find(
          candidate =>
            idKey(candidate.team.id) ===
            idKey(team.pairedTeamId)
        );

        if (!partnerNode) {
          unpaired.push({
            id: team.id,
            name: team.name,
            side: stats.side,
            size: stats.size
          });
          return;
        }

        const pairCohesion =
          calculatePairCohesion(
            node,
            partnerNode
          );

        team.pairedTeamName =
          partnerNode.team.name;
        team.pairCohesion =
          Number(pairCohesion.toFixed(2));

        if (processedPairs.has(idKey(team.id))) {
          return;
        }

        processedPairs.add(idKey(team.id));
        processedPairs.add(idKey(partnerNode.team.id));

        const firstRdos =
          stats.anchor?.rdoDays
            ? [...stats.anchor.rdoDays]
            : [];
        const secondRdos =
          partnerNode.stats.anchor?.rdoDays
            ? [...partnerNode.stats.anchor.rdoDays]
            : [];

        pairs.push({
          pairId:
            `pair-${team.id}-${partnerNode.team.id}`,
          side: stats.side,
          pairCohesion:
            Number(pairCohesion.toFixed(2)),
          totalSize:
            stats.size +
            partnerNode.stats.size,
          roleBreakdown: {
            stso:
              stats.STSO +
              partnerNode.stats.STSO,
            ltso:
              stats.LTSO +
              partnerNode.stats.LTSO,
            tso:
              stats.TSO +
              partnerNode.stats.TSO
          },
          teamA: {
            id: team.id,
            name: team.name,
            cohesion: team.teamCohesion,
            size: stats.size,
            anchorLineId:
              stats.anchor?.id ?? null,
            anchorRdoDays: firstRdos,
            members: [...team.members]
          },
          teamB: {
            id: partnerNode.team.id,
            name: partnerNode.team.name,
            cohesion:
              partnerNode.stats.cohesion !== null
                ? Number(
                    partnerNode.stats.cohesion.toFixed(2)
                  )
                : null,
            size: partnerNode.stats.size,
            anchorLineId:
              partnerNode.stats.anchor?.id ?? null,
            anchorRdoDays: secondRdos,
            members: [...partnerNode.team.members]
          },
          anchorRdoOverlapDays:
            getRdoOverlap(
              stats.anchor,
              partnerNode.stats.anchor
            )
        });
      });

      const assignedIds = getAssignedEligibleIds();
      const unassignedEligibleLines = getEligibleLines()
        .filter(line => !assignedIds.has(idKey(line.id)))
        .map(line => ({
          id: line.id,
          lineCode: line.lineCode ?? null,
          role: getRole(line),
          side: getSide(line)
        }));

      const excludedLines = getExcludedLines().map(
        line => ({
          id: line.id,
          lineCode: line.lineCode ?? null,
          position:
            line.position ??
            line.extraName ??
            line.role ??
            null,
          reason:
            "Explicit position is not STSO, LTSO, or TSO."
        })
      );

      return {
        pairs,
        unpaired,
        unassignedEligibleLines,
        excludedLines
      };
    }

    function exportJSON() {
      if (!appData) return;

      const assignedCount =
        getAssignedEligibleIds().size;
      const eligibleCount =
        getEligibleLines().length;

      if (assignedCount !== eligibleCount) {
        const proceed = confirm(
          `Warning: ${assignedCount} of ${eligibleCount} eligible lines are assigned.\n\n` +
          `Would you like to export anyway? (Unassigned lines will be documented in results.unassignedEligibleLines)`
        );
        if (!proceed) return;
      }

      const {
        pairs,
        unpaired,
        unassignedEligibleLines,
        excludedLines
      } = buildPairsExportData();

      appData.results.pairs = pairs;
      appData.results.unpairedTeams = unpaired;
      appData.results.unassignedEligibleLines = unassignedEligibleLines;
      appData.results.unteamedOtherPositionLines = excludedLines;

      appData.meta = appData.meta || {};
      appData.meta.pairingSummary = {
        exportedAt: new Date().toISOString(),
        eligibleRoles: [
          "STSO",
          "LTSO",
          "TSO"
        ],
        totalLines:
          appData.results.lines.length,
        tsoLineCount:
          getLinesByRole("TSO").length,
        ltsoLineCount:
          getLinesByRole("LTSO").length,
        stsoLineCount:
          getLinesByRole("STSO").length,
        eligibleLineCount:
          eligibleCount,
        assignedEligibleLineCount:
          assignedCount,
        unassignedEligibleLineCount:
          unassignedEligibleLines.length,
        excludedLineCount:
          excludedLines.length,
        totalTeams:
          appData.results.teams.filter(
            team => team.members?.length
          ).length,
        totalPairs:
          pairs.length,
        unpairedCount:
          unpaired.length
      };

      const content = JSON.stringify(
        appData,
        null,
        2
      );
      const blob = new Blob(
        [content],
        {
          type: "application/json"
        }
      );
      const url =
        URL.createObjectURL(blob);
      const anchor =
        document.createElement("a");
      anchor.href = url;
      anchor.download =
        `balanced_teams_with_pairs_${Date.now()}.json`;
      document.body.appendChild(anchor);
      anchor.click();
      document.body.removeChild(anchor);
      URL.revokeObjectURL(url);
    }

    function exportPairsCSV() {
      if (!appData) return;

      const assignedCount =
        getAssignedEligibleIds().size;
      const eligibleCount =
        getEligibleLines().length;

      if (assignedCount !== eligibleCount) {
        const proceed = confirm(
          `Warning: ${assignedCount} of ${eligibleCount} eligible lines are assigned.\n\n` +
          `Would you like to export CSV anyway?`
        );
        if (!proceed) return;
      }

      const {
        pairs,
        unpaired
      } = buildPairsExportData();

      const headers = [
        "Pair ID",
        "Side",
        "Pair Cohesion (%)",
        "Team A ID",
        "Team A Name",
        "Team A Size",
        "Team A Cohesion (%)",
        "Team A Anchor RDOs",
        "Team B ID",
        "Team B Name",
        "Team B Size",
        "Team B Cohesion (%)",
        "Team B Anchor RDOs",
        "Total Combined Size",
        "STSO Total",
        "LTSO Total",
        "TSO Total",
        "Anchor RDO Overlap Days"
      ];

      const rows = pairs.map(pair => {
        const firstRdos = (
          pair.teamA.anchorRdoDays || []
        )
          .map(day => DAYS[Number(day)])
          .join("; ");
        const secondRdos = (
          pair.teamB.anchorRdoDays || []
        )
          .map(day => DAYS[Number(day)])
          .join("; ");

        return [
          escapeCsv(pair.pairId),
          escapeCsv(pair.side),
          pair.pairCohesion,
          escapeCsv(pair.teamA.id),
          escapeCsv(pair.teamA.name),
          pair.teamA.size,
          pair.teamA.cohesion ?? "",
          escapeCsv(firstRdos),
          escapeCsv(pair.teamB.id),
          escapeCsv(pair.teamB.name),
          pair.teamB.size,
          pair.teamB.cohesion ?? "",
          escapeCsv(secondRdos),
          pair.totalSize,
          pair.roleBreakdown.stso,
          pair.roleBreakdown.ltso,
          pair.roleBreakdown.tso,
          pair.anchorRdoOverlapDays
        ].join(",");
      });

      unpaired.forEach(team => {
        rows.push([
          escapeCsv("UNPAIRED"),
          escapeCsv(team.side),
          "",
          escapeCsv(team.id),
          escapeCsv(team.name),
          team.size,
          "",
          "",
          "",
          "",
          "",
          "",
          "",
          team.size,
          "",
          "",
          "",
          ""
        ].join(","));
      });

      const content = [
        headers.join(","),
        ...rows
      ].join("\r\n");

      const blob = new Blob(
        [content],
        {
          type: "text/csv;charset=utf-8;"
        }
      );
      const url =
        URL.createObjectURL(blob);
      const anchor =
        document.createElement("a");
      anchor.href = url;
      anchor.download =
        `team_pairings_summary_${Date.now()}.csv`;
      document.body.appendChild(anchor);
      anchor.click();
      document.body.removeChild(anchor);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
